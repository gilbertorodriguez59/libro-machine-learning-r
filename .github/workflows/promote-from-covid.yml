name: Promover edición validada a estable 1.0.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-from-covid.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promocion-estable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio estable
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: stable

      - name: Obtener snapshot validado de la edición COVID
        run: |
          git init source
          git -C source remote add origin https://github.com/gilbertorodriguez59/libro-machine-learning-r-covid.git
          git -C source fetch --depth=1 origin c8ca8aeab9c83951c639be0d5e3496d20edcb82c
          git -C source checkout --detach FETCH_HEAD
          echo "Snapshot fuente: $(git -C source rev-parse HEAD)"

      - name: Sincronizar fuentes hacia el estable
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='docs/' \
            --exclude='.quarto/' \
            --exclude='_freeze/' \
            --exclude='_pdf_temp/' \
            --exclude='render-*.log' \
            source/ stable/

      - name: Adaptar URLs y marcar versión estable 1.0.0
        working-directory: stable
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          old = 'libro-machine-learning-r-covid'
          new = 'libro-machine-learning-r'

          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts or 'docs' in p.parts:
                  continue
              try:
                  data = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if old in data:
                  p.write_text(data.replace(old, new), encoding='utf-8')

          index = Path('index.qmd')
          text = index.read_text(encoding='utf-8')
          text, n = re.subn(r'\*\*Versión:\*\*\s*[^\n]+', '**Versión:** 1.0.0  ', text, count=1)
          if n != 1:
              raise SystemExit('No fue posible fijar la versión 1.0.0 en index.qmd')
          index.write_text(text, encoding='utf-8')
          print('URLs adaptadas al repositorio estable y versión fijada en 1.0.0')
          PY

      - name: Validar fuentes promovidas
        working-directory: stable
        run: |
          test -f index.qmd
          test -f referencias.bib
          test -f referencias.qmd
          test -f Aprendizaje_y_Clasificacion_Automatica_con_R_Colab.ipynb
          test -f colab/00-indice-colabs.ipynb
          test -f colab/01-introduccion.ipynb
          test -f colab/13-kmeans.ipynb
          test -f datos/covid19/procesados/covid19_mexico_2022_ml_preparado.csv.gz
          grep -q '\*\*Versión:\*\* 1.0.0' index.qmd
          grep -q 'salud_covid_historicos_2022' referencias.bib
          grep -q 'Dirección General de Epidemiología' referencias.qmd
          grep -q 'Fundamentos Matemáticos del Aprendizaje Automático' referencias.qmd
          ! grep -RIl --exclude-dir='.git' --exclude-dir='.github' --exclude-dir='docs' 'libro-machine-learning-r-covid' . | grep -q .

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Instalar bibliotecas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev

      - name: Instalar dependencias R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::data.table
            any::scales
            any::class
            any::rpart
            any::randomForest
            any::ranger
            any::e1071
            any::naivebayes
            any::neuralnet
            any::cluster
            any::caret
            any::factoextra
            any::plotly
            any::DT
            any::htmltools
            any::jsonlite
            any::fs
            any::shiny
            any::shinylive
          cache-version: stable-1

      - name: Renderizar PDF estable
        working-directory: stable
        run: |
          rm -rf docs .quarto _freeze
          quarto render --profile pdf --to pdf --no-cache
          test -s docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          cp docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf /tmp/libro-estable.pdf

      - name: Renderizar web estable
        working-directory: stable
        run: |
          quarto render --to html --no-cache
          test -f docs/index.html

      - name: Restaurar PDF y normalizar enlaces
        working-directory: stable
        run: |
          cp /tmp/libro-estable.pdf docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          find docs -type f -name '*.html' -print0 | xargs -0 sed -i 's/Aprendizaje-y-Clasificación-Automática-con-R\.pdf/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf/g'
          rm -f "docs/Aprendizaje-y-Clasificación-Automática-con-R.pdf" docs/libro-machine-learning-r.pdf

      - name: Validación final estable 1.0.0
        working-directory: stable
        run: |
          test -s docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          grep -q '1.0.0' docs/index.html
          grep -q 'Fundamentos Matemáticos del Aprendizaje Automático' docs/referencias.html
          grep -q 'Dirección General de Epidemiología' docs/referencias.html
          grep -q 'libro-machine-learning-r/blob/main/colab/06-knn.ipynb' docs/05-knn.html
          grep -q 'libro-machine-learning-r/blob/main/colab/13-kmeans.ipynb' docs/12-kmeans.html
          ! grep -RIl --exclude-dir='site_libs' 'libro-machine-learning-r-covid' docs | grep -q .

      - name: Publicar snapshot en main estable
        working-directory: stable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "El estable ya coincide con la versión 1.0.0"
            exit 0
          fi

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Error: la promoción no debe modificar workflows"
            exit 1
          fi

          git commit -m "Publicar versión estable 1.0.0 desde edición validada [skip ci]"
          git push origin HEAD:main
