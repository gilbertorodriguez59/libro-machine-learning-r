name: Validar edición bilingüe 2026

on:
  push:
    branches: [edicion-2026-bilingue]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-bilingue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-edicion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Configurar TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Instalar bibliotecas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev poppler-utils

      - name: Instalar dependencias R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::data.table
            any::scales
            any::class
            any::rpart
            any::randomForest
            any::ranger
            any::e1071
            any::naivebayes
            any::neuralnet
            any::cluster
            any::caret
            any::factoextra
            any::plotly
            any::DT
            any::htmltools
            any::jsonlite
            any::fs
            any::shiny
            any::shinylive
          cache-version: bilingual-2026-2

      - name: Renderizar edición web en español
        run: |
          rm -rf docs .quarto _freeze
          quarto render --to html --no-cache
          test -s docs/index.html

      - name: Renderizar edición web en inglés
        run: |
          quarto render en --to html --no-cache
          test -s docs/en/index.html

      - name: Validar estructura bilingüe HTML
        run: |
          test -s docs/00-prefacio.html
          test -s docs/00-agradecimientos.html
          test -s docs/04-regresion-lineal-multiple-2026.html
          test -s docs/04-regresion-logistica-2026.html
          test -s docs/05-knn.html
          test -s docs/06-arboles-decision.html
          test -s docs/07-random-forest.html
          test -s docs/08-evaluacion-modelos.html
          test -s docs/09-svm.html
          test -s docs/10-naive-bayes.html
          test -s docs/11-redes-neuronales.html
          test -s docs/12-kmeans.html
          test -s docs/indice-figuras.html
          test -s docs/indice-tematico.html
          test -s docs/en/00-preface.html
          test -s docs/en/00-acknowledgments.html
          test -s docs/en/00-google-colab.html
          test -s docs/en/figure-index.html
          test -s docs/en/subject-index.html
          test -s docs/en/01-introduction.html
          test -s docs/en/02-data-preparation.html
          test -s docs/en/03-exploratory-data-analysis.html
          test -s docs/en/04-linear-regression.html
          test -s docs/en/05-logistic-regression.html
          test -s docs/en/06-knn.html
          test -s docs/en/07-decision-trees.html
          test -s docs/en/08-random-forest.html
          test -s docs/en/09-model-evaluation.html
          test -s docs/en/10-svm.html
          test -s docs/en/11-naive-bayes.html
          test -s docs/en/12-neural-networks.html
          test -s docs/en/13-kmeans.html
          grep -q 'English' docs/index.html
          grep -q 'Español' docs/en/index.html
          grep -q 'Machine Learning and Automatic Classification with R' docs/en/index.html
          grep -q 'Supplementary materials for this chapter' docs/en/01-introduction.html
          grep -q 'Interactive data preparation' docs/en/02-data-preparation.html
          grep -q 'bmv-tDPZGjQ' docs/en/02-data-preparation.html
          grep -q 'Interactive data explorer' docs/en/03-exploratory-data-analysis.html
          grep -q 'U2hd8iEovCY' docs/en/03-exploratory-data-analysis.html
          grep -q 'Laboratorio de regresión lineal' docs/04-regresion-lineal-multiple-2026.html
          grep -q 'Linear regression laboratory' docs/en/04-linear-regression.html
          grep -q 'Calibración por grupos de probabilidad' docs/04-regresion-logistica-2026.html
          grep -q 'Calibration by probability groups' docs/en/05-logistic-regression.html
          grep -q 'Selección de k en el conjunto de validación' docs/05-knn.html
          grep -q 'Selecting k on the validation set' docs/en/06-knn.html
          grep -q 'Poda mediante error de validación cruzada' docs/06-arboles-decision.html
          grep -q 'Prune using cross-validation error' docs/en/07-decision-trees.html
          grep -q 'Selección de mtry mediante Brier OOB' docs/07-random-forest.html
          grep -q 'Selecting mtry using OOB Brier score' docs/en/08-random-forest.html
          grep -q 'Selección del umbral con predicciones fuera de pliegue' docs/08-evaluacion-modelos.html
          grep -q 'Threshold selection with out-of-fold predictions' docs/en/09-model-evaluation.html
          grep -q 'Artificial Neural Networks' docs/en/12-neural-networks.html
          grep -q 'Interactive k-means laboratory' docs/en/13-kmeans.html
          grep -q '02-preparacion-datos-2026.html' docs/indice-tematico.html
          grep -q '04-regresion-logistica-2026.html' docs/indice-figuras.html
          grep -q 'en/04-linear-regression.html' docs/04-regresion-lineal-multiple-2026.html
          grep -q '../04-regresion-lineal-multiple-2026.html' docs/en/04-linear-regression.html

      - name: Renderizar PDF en español
        run: |
          quarto render --profile pdf --to pdf --no-cache
          test -s docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          pdfinfo docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf | grep -q '^Pages:'

      - name: Renderizar PDF en inglés
        run: |
          quarto render en --profile pdf --to pdf --no-cache
          test -s docs/en/Machine-Learning-and-Automatic-Classification-with-R.pdf
          pdfinfo docs/en/Machine-Learning-and-Automatic-Classification-with-R.pdf | grep -q '^Pages:'

      - name: Guardar edición bilingüe completa como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: libro-bilingue-html-pdf
          path: docs
          if-no-files-found: error
