name: Validar edición bilingüe 2026

on:
  push:
    branches: [edicion-2026-bilingue]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-bilingue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar-edicion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Configurar TinyTeX
        uses: r-lib/actions/setup-tinytex@v2

      - name: Instalar bibliotecas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev poppler-utils

      - name: Instalar dependencias R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::data.table
            any::scales
            any::class
            any::rpart
            any::randomForest
            any::ranger
            any::e1071
            any::naivebayes
            any::neuralnet
            any::cluster
            any::caret
            any::factoextra
            any::plotly
            any::DT
            any::htmltools
            any::jsonlite
            any::fs
            any::shiny
            any::shinylive
          cache-version: bilingual-2026-3

      - name: Validar archivos fuente críticos
        run: |
          test -s datos/atus_ml_preparado.csv
          test -s datos/covid19/procesados/covid19_mexico_2022_ml_preparado.csv.gz
          test -s datos/covid19/procesados/conteo_casos_confirmados_2020_2025.csv
          test -s datos/covid19/comparacion_estructural_2020_2025.csv
          test -s colab/14-comparacion-integral.ipynb
          grep -q '2022,TRUE,covid19_mexico_2022_ml_preparado.csv.gz' datos/covid19/comparacion_estructural_2020_2025.csv
          grep -q 'Comparación integral y selección de modelos' 13-comparacion-integral.qmd
          grep -q 'Integrated Model Comparison and Selection' en/14-integrated-model-comparison.qmd
          grep -q 'keras3' 11-redes-neuronales.qmd
          grep -q 'keras3' en/12-neural-networks.qmd

      - name: Renderizar edición web en español
        run: |
          rm -rf docs .quarto _freeze
          mkdir -p artifacts/quarto-diagnostics
          set +e
          quarto render --to html --no-cache 2>&1 | tee artifacts/quarto-diagnostics/es-html.log
          status=${PIPESTATUS[0]}
          printf '\nQuarto exit code: %s\n' "$status" | tee -a artifacts/quarto-diagnostics/es-html.log
          set -e
          test "$status" -eq 0
          test -s docs/index.html

      - name: Renderizar edición web en inglés
        run: |
          mkdir -p artifacts/quarto-diagnostics
          set +e
          quarto render en --to html --no-cache 2>&1 | tee artifacts/quarto-diagnostics/en-html.log
          status=${PIPESTATUS[0]}
          printf '\nQuarto exit code: %s\n' "$status" | tee -a artifacts/quarto-diagnostics/en-html.log
          set -e
          test "$status" -eq 0
          test -s docs/en/index.html

      - name: Validar estructura bilingüe HTML
        run: |
          test -s docs/00-prefacio.html
          test -s docs/00-agradecimientos.html
          test -s docs/04-regresion-lineal-multiple-2026.html
          test -s docs/04-regresion-logistica-2026.html
          test -s docs/05-knn.html
          test -s docs/06-arboles-decision.html
          test -s docs/07-random-forest.html
          test -s docs/08-evaluacion-modelos.html
          test -s docs/09-svm.html
          test -s docs/10-naive-bayes.html
          test -s docs/11-redes-neuronales.html
          test -s docs/12-kmeans.html
          test -s docs/13-comparacion-integral.html
          test -s docs/indice-figuras.html
          test -s docs/indice-tematico.html
          test -s docs/en/00-preface.html
          test -s docs/en/00-acknowledgments.html
          test -s docs/en/00-google-colab.html
          test -s docs/en/01-introduction.html
          test -s docs/en/02-data-preparation.html
          test -s docs/en/03-exploratory-data-analysis.html
          test -s docs/en/04-linear-regression.html
          test -s docs/en/05-logistic-regression.html
          test -s docs/en/06-knn.html
          test -s docs/en/07-decision-trees.html
          test -s docs/en/08-random-forest.html
          test -s docs/en/09-model-evaluation.html
          test -s docs/en/10-svm.html
          test -s docs/en/11-naive-bayes.html
          test -s docs/en/12-neural-networks.html
          test -s docs/en/13-kmeans.html
          test -s docs/en/14-integrated-model-comparison.html
          test -s docs/en/figure-index.html
          test -s docs/en/subject-index.html
          grep -q 'English' docs/index.html
          grep -q 'Español' docs/en/index.html
          grep -q '14 cuadernos' docs/00-cuaderno-google-colab.html
          grep -q '14 independent' docs/en/00-google-colab.html
          grep -q 'fourteen technical chapters' docs/en/index.html
          grep -q 'Seleccionar el umbral en validación' docs/11-redes-neuronales.html
          grep -q 'keras3' docs/11-redes-neuronales.html
          grep -q 'Select the threshold on validation data' docs/en/12-neural-networks.html
          grep -q 'keras3' docs/en/12-neural-networks.html
          grep -q 'perfiles mensuales con ATUS' docs/12-kmeans.html
          grep -q 'monthly ATUS profiles' docs/en/13-kmeans.html
          grep -q 'Comparación integral y selección de modelos' docs/13-comparacion-integral.html
          grep -q 'Integrated Model Comparison and Selection' docs/en/14-integrated-model-comparison.html
          grep -q 'Naive Bayes Classifier' docs/en/11-naive-bayes.html
          grep -q 'Support Vector Machines' docs/en/10-svm.html
          grep -q '13-comparacion-integral.html' docs/indice-tematico.html
          grep -q '14-integrated-model-comparison.html' docs/en/subject-index.html
          grep -q '14-integrated-model-comparison.html' docs/13-comparacion-integral.html
          grep -q '../13-comparacion-integral.html' docs/en/14-integrated-model-comparison.html

      - name: Renderizar PDF en español
        run: |
          mkdir -p artifacts/quarto-diagnostics
          set +e
          quarto render --profile pdf --to pdf --no-cache 2>&1 | tee artifacts/quarto-diagnostics/es-pdf.log
          status=${PIPESTATUS[0]}
          printf '\nQuarto exit code: %s\n' "$status" | tee -a artifacts/quarto-diagnostics/es-pdf.log
          set -e
          test "$status" -eq 0
          test -s docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf
          pdfinfo docs/Aprendizaje-y-Clasificacion-Automatica-con-R.pdf | grep -q '^Pages:'

      - name: Renderizar PDF en inglés
        run: |
          mkdir -p artifacts/quarto-diagnostics
          set +e
          quarto render en --profile pdf --to pdf --no-cache 2>&1 | tee artifacts/quarto-diagnostics/en-pdf.log
          status=${PIPESTATUS[0]}
          printf '\nQuarto exit code: %s\n' "$status" | tee -a artifacts/quarto-diagnostics/en-pdf.log
          set -e
          test "$status" -eq 0
          test -s docs/en/Machine-Learning-and-Automatic-Classification-with-R.pdf
          pdfinfo docs/en/Machine-Learning-and-Automatic-Classification-with-R.pdf | grep -q '^Pages:'

      - name: Guardar diagnóstico completo de Quarto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarto-diagnostics-${{ github.run_id }}
          path: artifacts/quarto-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar edición bilingüe completa como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: libro-bilingue-html-pdf
          path: docs
          if-no-files-found: error
