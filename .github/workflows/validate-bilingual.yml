name: Validar edición bilingüe 2026

on:
  push:
    branches: [edicion-2026-bilingue]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-bilingue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-html:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Instalar bibliotecas del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev

      - name: Instalar dependencias R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::knitr
            any::ggplot2
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::data.table
            any::scales
            any::class
            any::rpart
            any::randomForest
            any::ranger
            any::e1071
            any::naivebayes
            any::neuralnet
            any::cluster
            any::caret
            any::factoextra
            any::plotly
            any::DT
            any::htmltools
            any::jsonlite
            any::fs
            any::shiny
            any::shinylive
          cache-version: bilingual-2026-1

      - name: Renderizar edición en español
        run: |
          rm -rf docs .quarto _freeze
          quarto render --to html --no-cache
          test -s docs/index.html

      - name: Renderizar edición en inglés
        run: |
          quarto render en --to html --no-cache
          test -s docs/en/index.html

      - name: Validar estructura bilingüe
        run: |
          test -s docs/00-prefacio.html
          test -s docs/00-agradecimientos.html
          test -s docs/04-regresion-lineal-multiple-2026.html
          test -s docs/04-regresion-logistica-2026.html
          test -s docs/05-knn.html
          test -s docs/06-arboles-decision.html
          test -s docs/07-random-forest.html
          test -s docs/en/00-preface.html
          test -s docs/en/00-acknowledgments.html
          test -s docs/en/00-google-colab.html
          test -s docs/en/figure-index.html
          test -s docs/en/subject-index.html
          test -s docs/en/01-introduction.html
          test -s docs/en/02-data-preparation.html
          test -s docs/en/03-exploratory-data-analysis.html
          test -s docs/en/04-linear-regression.html
          test -s docs/en/05-logistic-regression.html
          test -s docs/en/06-knn.html
          test -s docs/en/07-decision-trees.html
          test -s docs/en/08-random-forest.html
          grep -q 'English' docs/index.html
          grep -q 'Español' docs/en/index.html
          grep -q 'Machine Learning and Automatic Classification with R' docs/en/index.html
          grep -q 'Supplementary materials for this chapter' docs/en/01-introduction.html
          grep -q 'Preparing Real-World Data' docs/en/02-data-preparation.html
          grep -q 'Interactive data preparation' docs/en/02-data-preparation.html
          grep -q 'bmv-tDPZGjQ' docs/en/02-data-preparation.html
          grep -q 'chapter-02-preparing-real-world-data.pdf' docs/en/02-data-preparation.html
          grep -q 'Exploratory Data Analysis' docs/en/03-exploratory-data-analysis.html
          grep -q 'Interactive data explorer' docs/en/03-exploratory-data-analysis.html
          grep -q 'U2hd8iEovCY' docs/en/03-exploratory-data-analysis.html
          grep -q 'chapter-03-exploratory-data-analysis.pdf' docs/en/03-exploratory-data-analysis.html
          grep -q 'Laboratorio de regresión lineal' docs/04-regresion-lineal-multiple-2026.html
          grep -q 'SE6DCeU9h1w' docs/04-regresion-lineal-multiple-2026.html
          grep -q 'Linear regression laboratory' docs/en/04-linear-regression.html
          grep -q 'SE6DCeU9h1w' docs/en/04-linear-regression.html
          grep -q 'chapter-04-simple-multiple-linear-regression.pdf' docs/en/04-linear-regression.html
          grep -q 'Calibración por grupos de probabilidad' docs/04-regresion-logistica-2026.html
          grep -q '7CwP40QDeys' docs/04-regresion-logistica-2026.html
          grep -q 'Calibration by probability groups' docs/en/05-logistic-regression.html
          grep -q 'Logistic regression laboratory' docs/en/05-logistic-regression.html
          grep -q '7CwP40QDeys' docs/en/05-logistic-regression.html
          grep -q 'chapter-05-logistic-regression-classification.pdf' docs/en/05-logistic-regression.html
          grep -q 'Selección de k en el conjunto de validación' docs/05-knn.html
          grep -q 'NLJj0QAWomU' docs/05-knn.html
          grep -q 'Selecting k on the validation set' docs/en/06-knn.html
          grep -q 'k-NN classification laboratory' docs/en/06-knn.html
          grep -q 'NLJj0QAWomU' docs/en/06-knn.html
          grep -q 'chapter-06-knn-presentation.pdf' docs/en/06-knn.html
          grep -q 'Poda mediante error de validación cruzada' docs/06-arboles-decision.html
          grep -q 'UperQjxBYEY' docs/06-arboles-decision.html
          grep -q 'Prune using cross-validation error' docs/en/07-decision-trees.html
          grep -q 'Interactive CART split explorer' docs/en/07-decision-trees.html
          grep -q 'UperQjxBYEY' docs/en/07-decision-trees.html
          grep -q 'chapter-07-decision-trees-presentation.pdf' docs/en/07-decision-trees.html
          grep -q 'Selección de mtry mediante Brier OOB' docs/07-random-forest.html
          grep -q 'KELSgYttifs' docs/07-random-forest.html
          grep -q 'Selecting mtry using OOB Brier score' docs/en/08-random-forest.html
          grep -q 'Random Forest voting simulator' docs/en/08-random-forest.html
          grep -q 'KELSgYttifs' docs/en/08-random-forest.html
          grep -q 'chapter-08-random-forest-presentation.pdf' docs/en/08-random-forest.html

      - name: Guardar sitio bilingüe como artefacto de validación
        uses: actions/upload-artifact@v4
        with:
          name: libro-bilingue-html
          path: docs
          if-no-files-found: error
